[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zoorik"
dynamic = ["version"]
description = "Zoorik's free cost assessments for Kubernetes (AKS, EKS) and VM disks (Azure, AWS): one Excel file of what you could save."
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Zoorik", email = "founders@zoorik.com" }]
keywords = ["kubernetes", "aks", "eks", "azure", "aws", "ebs", "cost", "finops", "assessment"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://zoorik.com"
Source = "https://github.com/getzoorik/assessment"
Issues = "https://github.com/getzoorik/assessment/issues"

[project.scripts]
zoorik = "zoorik.__main__:main"

[tool.hatch.version]
path = "zoorik/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["zoorik"]

[tool.hatch.build.targets.wheel.force-include]
"k8s.py" = "zoorik/k8s.py"
"disks.py" = "zoorik/disks.py"

[tool.hatch.build.targets.sdist]
include = ["/zoorik", "/k8s.py", "/disks.py", "/README.md", "/LICENSE"]
