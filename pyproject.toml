[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zoorik"
dynamic = ["version"]
description = "Zoorik's free cost assessments for Kubernetes (AKS, EKS) and VM disks (Azure, AWS): one PDF report of what you could save."
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Zoorik", email = "founders@zoorik.com" }]
keywords = ["kubernetes", "aks", "eks", "azure", "aws", "ebs", "cost", "finops", "assessment"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://zoorik.com"
Source = "https://github.com/getzoorik/assessment"
Issues = "https://github.com/getzoorik/assessment/issues"

[project.scripts]
zoorik = "zoorik.__main__:main"

[tool.hatch.version]
path = "zoorik/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["zoorik"]

[tool.hatch.build.targets.wheel.force-include]
"k8s.py" = "zoorik/k8s.py"
# zoorik/disks is the disk method's package, so disks.py ships under another name.
"disks.py" = "zoorik/disks_script.py"

[tool.hatch.build.targets.sdist]
include = ["/zoorik", "/k8s.py", "/disks.py", "/README.md", "/LICENSE"]

[tool.mypy]
python_version = "3.8"
strict = true
warn_unreachable = true
files = ["zoorik", "tests"]
# The old entry point keeps today's form until the package replaces it.
exclude = ['^zoorik/__main__\.py$']

[tool.importlinter]
root_package = "zoorik"

[[tool.importlinter.contracts]]
name = "Each layer imports only the layers below it"
type = "layers"
layers = [
  "zoorik.cli",
  "zoorik.report",
  "zoorik.kubernetes | zoorik.disks",
  "zoorik.kubectl | zoorik.pricing",
  "zoorik.cloud",
  "zoorik.system",
  "zoorik.console | zoorik.format | zoorik.output",
  "zoorik.errors",
]

[[tool.importlinter.contracts]]
name = "Only the runtime, the cloud readers and the cluster readers hold the command runner"
type = "protected"
protected_modules = ["zoorik.system.process"]
allowed_importers = ["zoorik.system.runtime", "zoorik.cloud", "zoorik.kubectl"]

[[tool.importlinter.contracts]]
name = "Only the runtime, the cloud readers and the price lists hold the HTTP client"
type = "protected"
protected_modules = ["zoorik.system.http"]
allowed_importers = ["zoorik.system.runtime", "zoorik.cloud", "zoorik.pricing"]

[[tool.importlinter.contracts]]
name = "Only the command line builds the runtime and the HTTP client"
type = "protected"
protected_modules = ["zoorik.system.runtime", "zoorik.pricing.http"]
allowed_importers = ["zoorik.cli"]

[[tool.importlinter.contracts]]
name = "Only the report draws the PDF"
type = "protected"
protected_modules = ["zoorik.report.pdf", "zoorik.report.blocks"]
allowed_importers = ["zoorik.report"]
