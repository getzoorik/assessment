target-version = "py38"
line-length = 120

[lint]
select = ["E", "W", "F", "I", "N", "D", "C90", "B", "UP", "SIM", "PL", "RUF"]
# The exception names state the failure (ToolNotInstalled, PriceNotFound), so they carry no Error suffix.
ignore = ["N818"]

[lint.pydocstyle]
convention = "pep257"

[lint.mccabe]
max-complexity = 10
