name: New check, cloud or region
description: Ask for something the scripts don't cover yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Every figure in a report comes from the user's cloud, their clusters or a public price list, and is never guessed. So the most helpful request says where the data would come from.
  - type: dropdown
    id: script
    attributes:
      label: Script
      options:
        - k8s.py (Kubernetes)
        - disks.py (Azure disks)
        - Both
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What you'd like
      options:
        - A new check or figure
        - A new cloud or Kubernetes platform
        - A region or a price that is missing
        - Clearer output
        - Something else
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Describe it
      description: What should the script read or show, and where in the report? For a missing region or price, name it and copy the reason the report shows today.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Where the data comes from
      description: The API, CLI command or public page that has this information, if you know it.
  - type: checkboxes
    id: help
    attributes:
      label: Helping
      options:
        - label: I'd like to send a pull request for this.
