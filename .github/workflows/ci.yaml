name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    name: Package on ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ["3.x"]
        include:
          - os: ubuntu-24.04
            python: "3.8"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests and replays
        run: python -m unittest discover -s tests -t .
      - name: The package installs, and its command prints its help and version
        run: |
          python -m pip install .
          zoorik --help
          zoorik --version
          zoorik assess --help
      # PATH holds only Python's folder, so neither az nor aws is found. On Windows the console script sits in Scripts,
      # outside that folder, so the run starts as python -I -m zoorik.cli.
      - name: Without az and aws, the run says what it needs and writes nothing
        run: |
          code=0
          PATH="$(dirname "$(command -v python)")" python -I -m zoorik.cli assess --sample-minutes 0 --out "$RUNNER_TEMP/out" > nocli.out 2>&1 || code=$?
          cat nocli.out
          test "$code" -eq 0
          test "$(tr -d '\r' < nocli.out)" = "This needs the Azure CLI (az) or the AWS CLI (aws), signed in. Open Azure Cloud Shell (shell.azure.com) or AWS CloudShell and run it there."
          test -z "$(ls -A "$RUNNER_TEMP/out")"
      # The Linux and Windows runners have az and aws installed but not signed in. On Windows az is az.cmd, so a
      # sign-in message (not "not installed") shows that the run finds it there.
      - name: Where az and aws are not signed in, the run says to sign in and writes nothing
        if: runner.os != 'macOS'
        run: |
          code=0
          zoorik assess --sample-minutes 0 --out "$RUNNER_TEMP/signed-out" < /dev/null > signed-out.out 2>&1 || code=$?
          cat signed-out.out
          test "$code" -eq 1
          tr -d '\r' < signed-out.out | grep -qx "Azure: not signed in to Azure; run az login"
          tr -d '\r' < signed-out.out | grep -qx "AWS: no AWS credentials; run aws configure or aws sso login"
          test -z "$(ls -A "$RUNNER_TEMP/signed-out")"

  npm:
    name: npx zoorik on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "18"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: The npm package holds only its launcher
        working-directory: npm
        run: npm pack --dry-run --json | node -e "const f=JSON.parse(require('fs').readFileSync(0))[0].files.map(x=>x.path).sort().join(' '); if (f !== 'LICENSE README.md bin/zoorik.js package.json') { console.error(f); process.exit(1) }"
      - name: Build the wheel
        run: |
          python -m pip install build==1.6.1
          python -m build --wheel --outdir "$RUNNER_TEMP/dist" .
      # Each run starts from nothing, in a home of its own: Node takes the home from USERPROFILE on Windows and from HOME
      # elsewhere, and the launcher makes its Python environment there. pip installs only from the wheel just built; it
      # reads PIP_* even under -I.
      - name: The launcher installs its own version from the wheel and runs it
        working-directory: npm
        env:
          PIP_NO_INDEX: "1"
          PIP_FIND_LINKS: ${{ runner.temp }}/dist
        run: |
          version=$(node -p "require('./package.json').version")
          HOME="$RUNNER_TEMP/home-launcher" USERPROFILE="$RUNNER_TEMP/home-launcher" node bin/zoorik.js --version > launcher.out
          cat launcher.out
          test "$(tr -d '\r' < launcher.out)" = "zoorik $version"
      - name: npx runs the packed launcher the same way
        working-directory: npm
        env:
          PIP_NO_INDEX: "1"
          PIP_FIND_LINKS: ${{ runner.temp }}/dist
        run: |
          version=$(node -p "require('./package.json').version")
          npm pack --pack-destination "$RUNNER_TEMP"
          HOME="$RUNNER_TEMP/home-npx" USERPROFILE="$RUNNER_TEMP/home-npx" npx --yes --package "$RUNNER_TEMP/zoorik-$version.tgz" zoorik --version > npx.out
          cat npx.out
          test "$(tr -d '\r' < npx.out)" = "zoorik $version"

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pinned mypy runs on Python 3.9 to 3.13, and import-linter on 3.11 or later.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the pinned tools
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check .
      - name: mypy, Linux
        run: mypy --platform linux
      - name: mypy, Windows
        run: mypy --platform win32
      - name: Import layers
        run: lint-imports --no-cache
